name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports
        # mypy still has untyped baseline debt; gate stays soft until the
        # baseline is annotated. Track in TODO. Remove ``continue-on-error``
        # once ``mypy app/`` returns clean to make typing breakage block merge.
        continue-on-error: true

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=30

  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mt5_bridge
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # MetaTrader5 仅 Windows 可安装，此处不装它——测试通过 conftest 的
      # sys.modules 注入 mock 覆盖（M3）。真实 SDK 行为由 Phase 0 spike
      # 在 VPS 上验证。
      - name: Install dependencies
        run: pip install fastapi uvicorn python-dotenv loguru pydantic pytest httpx

      - name: Run bridge tests
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npx eslint .

      - name: Type check (TypeScript)
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
